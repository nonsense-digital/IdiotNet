{% extends 'base.html' %}

{% block title %}IdiotNet | Latest Posts{% endblock %}
{% block content %}
    <h1>Search Posts</h1>
    <form method="get" action="{{ routes["search"] }}">
        <label for="query">Search Query:</label> <input type="text" id="query" name="query" value="{{query}}" />
        <input type="submit" value="Search" />
    </form>
    {% if posts %}
        {% include 'listings/posts.html' %}
    {% endif %}

{% endblock %}
