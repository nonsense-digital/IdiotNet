{% extends 'base.html' %}

{% block title %}IdiotNet | Change Your Password{% endblock %}
{% block content %}
    <h1>Change your Password</h1>
    {% if error_message %}
        <div id="error">
            <h3>Error</h3>
            <p>{{ error_message }}</p>
        </div>
    {% endif %}
    <form action="{{ routes["change_password"] }}" method="POST">
        <label for="old_password">Old Password:</label><input name="old_password" type="password" id="old_password" maxlength="50"><br>
        <label for="new_password">New Password:</label><input name="new_password" type="password" id="new_password" maxlength="50"><br>
        <label for="verify_new_password">Verify New Password:</label><input name="verify_new_password" type="password" id="verify_new_password" maxlength="50"><br>
        <input type="submit" class="submit" value="Submit">
    </form>
{% endblock %}
