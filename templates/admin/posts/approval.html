{% extends 'base.html' %}

{% block title %}IdiotNet | Approve/Deny Post{% endblock %}
{% block content %}
    <h1>Approve/Deny Post "{{ post.title }}"</h1>
    {% include 'admin/posts/post-info.html' %}
    <form action="{{ request.url }}" id="approve_form" method="post">
        <label for="verdict">Verdict: </label>
        <select id="verdict" name="verdict">
            <option value="none" disabled selected>Select...</option>
            <option value="approve">Approve</option>
            <option value="deny">Deny</option>
        </select>
        <br/>
        <input id="submit" name="submit" type="submit" value="Confirm">
    </form>
{% endblock %}
{% block extra_js %}
    <script src="/static/js/admin.js"></script>
{% endblock %}
